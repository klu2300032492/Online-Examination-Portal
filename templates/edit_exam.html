<!DOCTYPE html>
<html>
<head>
    <title>Edit Exam</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h2>Edit Exam</h2>

<form method="POST">

    <input type="text"
           name="exam_name"
           value="{{ exam[1] }}"
           class="form-control mb-3">

    <input type="date"
           name="exam_date"
           value="{{ exam[2] }}"
           class="form-control mb-3">

    <input type="time"
           name="start_time"
           value="{{ exam[3] }}"
           class="form-control mb-3">

    <input type="time"
           name="end_time"
           value="{{ exam[4] }}"
           class="form-control mb-3">

    <input type="text"
           name="status"
           value="{{ exam[5] }}"
           class="form-control mb-3">

    <button class="btn btn-success">
        Update Exam
    </button>

</form>

</div>

</body>
</html>
