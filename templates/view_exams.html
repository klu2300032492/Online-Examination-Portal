<!DOCTYPE html>
<html>
<head>
    <title>View Exams</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>All Exams</h2>

    <table class="table table-bordered">

        <tr>
            <th>ID</th>
            <th>Exam Name</th>
            <th>Date</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        {% for exam in exams %}

        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ exam[1] }}</td>
            <td>{{ exam[2] }}</td>
            <td>{{ exam[3] }}</td>
            <td>{{ exam[4] }}</td>
            <td>{{ exam[5] }}</td>
            <td>

<a href="/manage_exam/{{ exam[0] }}"
class="btn btn-primary btn-sm">
Manage
</a>

<a href="/edit_exam/{{ exam[0] }}"
class="btn btn-warning btn-sm">
Edit
</a>

<a href="/delete_exam/{{ exam[0] }}"
class="btn btn-danger btn-sm">
Delete
</a>

</td>
        </tr>

        {% endfor %}

    </table>
    <br><br>

<div class="text-center">

    <a href="/admin_dashboard"
       class="btn btn-primary">
        Back To Dashboard
    </a>

</div>

</div>

</body>
</html>
