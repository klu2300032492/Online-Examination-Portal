<!DOCTYPE html>
<html>
<head>
    <title>Edit Question</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

<h1>Edit Question</h1>

<form method="POST">

    <input type="text"
           name="question"
           value="{{ question[1] }}"
           class="form-control mb-3">

    <input type="text"
           name="option1"
           value="{{ question[2] }}"
           class="form-control mb-3">

    <input type="text"
           name="option2"
           value="{{ question[3] }}"
           class="form-control mb-3">

    <input type="text"
           name="option3"
           value="{{ question[4] }}"
           class="form-control mb-3">

    <input type="text"
           name="option4"
           value="{{ question[5] }}"
           class="form-control mb-3">

    <input type="text"
           name="correct_answer"
           value="{{ question[6] }}"
           class="form-control mb-3">

    <button class="btn btn-success">
        Update Question
    </button>

</form>

</div>

</body>
</html>
