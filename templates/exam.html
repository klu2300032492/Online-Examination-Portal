<!DOCTYPE html>
<html>

<head>

    <title>{{ exam_name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- Exam Title -->

    <div class="card shadow mb-4">

        <div class="card-header bg-primary text-white">

            <div class="d-flex justify-content-between align-items-center">

                <h3 class="mb-0">
                    {{ exam_name }}
                </h3>

                <h4 class="mb-0">
                    ⏰ Time Left :
                    <span id="timer"></span>
                </h4>

            </div>

        </div>

    </div>

    <!-- Exam Form -->

    <form method="POST" id="examForm">

        {% for q in questions %}

        <div class="card shadow mb-4">

            <div class="card-body">

                <h5>

                    <b>Question {{ loop.index }}</b>

                </h5>

                <p class="mt-3">

                    {{ q[1] }}

                </p>

                <hr>

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="q{{ q[0] }}"
                        value="{{ q[2] }}"
                        id="q{{ q[0] }}1">

                    <label
                        class="form-check-label"
                        for="q{{ q[0] }}1">

                        {{ q[2] }}

                    </label>

                </div>

                <div class="form-check mt-2">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="q{{ q[0] }}"
                        value="{{ q[3] }}"
                        id="q{{ q[0] }}2">

                    <label
                        class="form-check-label"
                        for="q{{ q[0] }}2">

                        {{ q[3] }}

                    </label>

                </div>

                <div class="form-check mt-2">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="q{{ q[0] }}"
                        value="{{ q[4] }}"
                        id="q{{ q[0] }}3">

                    <label
                        class="form-check-label"
                        for="q{{ q[0] }}3">

                        {{ q[4] }}

                    </label>

                </div>

                <div class="form-check mt-2">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="q{{ q[0] }}"
                        value="{{ q[5] }}"
                        id="q{{ q[0] }}4">

                    <label
                        class="form-check-label"
                        for="q{{ q[0] }}4">

                        {{ q[5] }}

                    </label>

                </div>

            </div>

        </div>

        {% endfor %}

        <div class="text-center mb-5">

            <button
                type="submit"
                class="btn btn-success btn-lg">

                Submit Exam

            </button>

        </div>

    </form>

</div>

<!-- Timer Script -->

<script>

let time = parseInt("{{ remaining_seconds }}");

function startTimer(){

    let minutes = Math.floor(time / 60);

    let seconds = time % 60;

    document.getElementById("timer").innerHTML =
        minutes + ":" + String(seconds).padStart(2,'0');

    if(time <= 0){

        alert("Time Up! Your exam will be submitted automatically.");

        document.getElementById("examForm").submit();

        return;

    }

    time--;

}

setInterval(startTimer,1000);

startTimer();

</script>

</body>

</html>
